name: sahayogi_mobile
description: Sahayogi Nepal mobile app (volunteers + public requesters/donors).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_map: ^7.0.2        # OSM option. If the team picks Google Maps, swap for google_maps_flutter.
  latlong2: ^0.9.1
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/VerticalLogo.png
    - assets/images/HorizontalLogo.png
    - assets/images/SahayogiNepalLogo.png
