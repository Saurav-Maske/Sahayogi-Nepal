name: Flutter CI/CD

on:
  push:
    branches: [deployment, main]
  pull_request:
    branches: [deployment, main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter analyze
        working-directory: ./apps/mobile

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter test
        working-directory: ./apps/mobile

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter build apk --release
        working-directory: ./apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  build-android-bundle:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter build appbundle --release
        working-directory: ./apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab

  deploy-firebase:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.ref == 'refs/heads/deployment' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Build ${{ github.run_number }} - ${{ github.sha }}"