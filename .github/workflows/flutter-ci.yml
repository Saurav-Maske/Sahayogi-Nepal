name: Flutter CI/CD

on:
  push:
    branches: [deployment, main]
  pull_request:
    branches: [deployment, main]

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter analyze
        working-directory: ./apps/mobile

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter test
        working-directory: ./apps/mobile

  build:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter build apk --release
        working-directory: ./apps/mobile
      - run: flutter build appbundle --release
        working-directory: ./apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab

  # Automatic deployment: once analyze + test + build all pass on a push to
  # `deployment`, publish the APK/AAB as a GitHub Release.
  # Needs no extra secrets (uses the built-in GITHUB_TOKEN). Never runs on PRs.
  deploy:
    name: Deploy (GitHub Release)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/deployment'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find dist -name 'app-release.apk' | head -n1)
          AAB=$(find dist -name 'app-release.aab' | head -n1)
          cp "$APK" sahayogi-nepal-${{ github.run_number }}.apk
          cp "$AAB" sahayogi-nepal-${{ github.run_number }}.aab
          gh release create "build-${{ github.run_number }}" \
            "sahayogi-nepal-${{ github.run_number }}.apk" \
            "sahayogi-nepal-${{ github.run_number }}.aab" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }} (${{ github.ref_name }})" \
            --generate-notes