name: Flutter CI/CD

on:
  push:
    branches: [deployment, main]
  pull_request:
    branches: [deployment, main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter analyze
        working-directory: ./apps/mobile

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter test
        working-directory: ./apps/mobile

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter build apk --release
        working-directory: ./apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  build-android-bundle:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
        working-directory: ./apps/mobile
      - run: flutter build appbundle --release
        working-directory: ./apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
